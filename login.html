<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">A. Student</a>
      <nav class="nav-links">
        <a data-page="index.html" href="index.html">Home</a>
        <a data-page="projects.html" href="projects.html">Projects</a>
        <a data-page="about.html" href="about.html">About</a>
        <a data-page="contact.html" href="contact.html">Contact</a>
        <a id="nav-admin" data-page="admin.html" href="admin.html" class="hidden">Admin</a>
      </nav>
      <div id="auth-slot"></div>
    </div>
  </header>

  <main class="container page">
    <section class="card form-card" style="max-width:560px; margin: 0 auto;">
      <h1>Sign In</h1>
      <p>Demo auth for role-based access. Use the role selector to switch between Guest, Viewer, and Admin behavior.</p>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" value="admin@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" value="password123" required />
        </div>
        <div class="form-group">
          <label for="role">Role</label>
          <select id="role">
            <option value="viewer">Viewer</option>
            <option value="admin">RoleAccessAdmin</option>
          </select>
        </div>
        <button class="btn btn-primary" type="submit">Login</button>
      </form>
    </section>
  </main>

  <footer><div class="container">© 2026 A. Student</div></footer>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
