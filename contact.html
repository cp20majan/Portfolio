<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">A. Student</a>
      <nav class="nav-links">
        <a data-page="index.html" href="index.html">Home</a>
        <a data-page="projects.html" href="projects.html">Projects</a>
        <a data-page="about.html" href="about.html">About</a>
        <a data-page="contact.html" href="contact.html">Contact</a>
        <a id="nav-admin" data-page="admin.html" href="admin.html" class="hidden">Admin</a>
      </nav>
      <div id="auth-slot"></div>
    </div>
  </header>

  <main class="container page">
    <section class="card form-card" style="max-width:700px; margin: 0 auto;">
      <h1>Contact</h1>
      <p>Let’s collaborate on secure industrial networking and automation projects.</p>
      <form id="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" required></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Send Message</button>
      </form>
      <p id="contact-status" class="hidden" style="margin-top:0.75rem;color:var(--primary);font-weight:600;">Thanks — your message has been captured locally for demo purposes.</p>
      <div style="margin-top:1.2rem;display:flex;gap:0.8rem;">
        <a class="btn btn-ghost" href="https://www.linkedin.com" target="_blank" rel="noreferrer">LinkedIn</a>
        <a class="btn btn-ghost" href="https://github.com" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </section>
  </main>

  <footer><div class="container">© 2026 A. Student</div></footer>
  <script src="js/app.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
